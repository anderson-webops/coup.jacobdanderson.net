name: Verify Coup static publication

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coup-static-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run rules and release regression suites
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          RUNNER_TEMP: ${{ runner.temp }}
        run: python3 -B -m unittest -v test_coup_simulator test_extensive_rules test_research_strategies test_research_statistics test_strategy_research test_analyze_strategy_research test_site scripts.test_release_artifact

      - name: Independently audit the expanded frozen research
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B analyze_strategy_research.py --verify-only

      - name: Validate exact static publication
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -I -B check_site.py --root .

      - name: Confirm optimized Python fails closed
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          if python3 -O -B check_site.py --root .; then
            echo "Publication checker unexpectedly accepted optimized Python" >&2
            exit 1
          fi

      - name: Build and verify exact static release candidate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          release_dir="${RUNNER_TEMP}/coup-release"
          python3 -I -B scripts/release_artifact.py build --output-dir "${release_dir}"
          python3 -I -B scripts/release_artifact.py verify \
            --release-dir "${release_dir}" \
            --expected-commit "${GITHUB_SHA}" \
            --expected-version "$(tr -d '\r\n' < VERSION)"

      - name: Retain verified release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coup-static-release-${{ github.sha }}
          path: ${{ runner.temp }}/coup-release/
          if-no-files-found: error
          retention-days: 14
